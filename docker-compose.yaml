# pademelon — VM dashboard for TrueNAS Scale.

services:
  pademelon:
    image: ghcr.io/perkyquirky/pademelon:latest
    container_name: pademelon
    restart: unless-stopped

    ports:
      - "8088:8088"

    volumes:
      - /run/truenas_libvirt:/run/truenas_libvirt
    user: "0:0"

    environment:
      # Optional: token for the private routes (job history, actions).
      # If you want read only stats comment out PADEMELON_TOKEN and PADAMELON_ALLOW_ACTIONS
      # Generate one with: openssl rand -hex 32
      - PADAMELON_TOKEN=change-me-to-your-generated-token
      #
      # Optional: unlock the VM power actions (start, shutdown, reboot,
      # force off, pause, resume, shut down all). Requires the token above —
      # the container refuses to start with actions on and no token.
      # Without this, the dashboard is fully read-only.
      - PADAMELON_ALLOW_ACTIONS=true

    # Everything below is optional; these are the defaults.
    # command:
    #   - "-theme=dracula"
    #   - "-listen=:8088"
    #   - "-interval=30s"
    #   - "-agent-timeout=5s"
    #   - "-stats-period=10s"
    #   - "-log-level=info"
    #   - "-log-format=text"
    #   - "-concurrency=8"
    #   - "-socket=/run/truenas_libvirt/libvirt-sock"

# pademelon — read-only VM dashboard for TrueNAS Scale.

services:
  pademelon:
    image: ghcr.io/perkyquirky/pademelon:latest
    container_name: pademelon
    restart: unless-stopped

    ports:
      - "8088:8088"

    volumes:
      - /run/truenas_libvirt:/run/truenas_libvirt
    user: "0:0"

    # Everything below is optional; these are the defaults.
    # command:
    #   - "-listen=:8088"
    #   - "-interval=30s"
    #   - "-agent-timeout=5s"
    #   - "-stats-period=10s"
    #   - "-log-level=info"
    #   - "-log-format=text"
    #   - "-concurrency=8"
    #   - "-socket=/run/truenas_libvirt/libvirt-sock"

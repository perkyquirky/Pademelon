# Literally have no idea wtf I am doing
# Hope this works

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: No write or exec calls
        run: |
          # DomainSetMemoryStatsPeriod is the single, deliberate exception:
          # it starts QEMU's internal balloon-stats poll timer. It sets no
          # memory, adds no devices and enters no guest — without it QEMU
          # only ever reports the one balloon snapshot taken at guest boot.
          # See README2.md "About the permissions". Every other write call
          # and guest-exec stays banned.
          if grep -rnE '\.Domain(Create|Destroy|Undefine|Shutdown|Reboot|Suspend|Resume|SetMemory|AttachDevice|DetachDevice)[A-Za-z]*\(|execute"[[:space:]]*:[[:space:]]*"guest-exec' \
               --include='*.go' . | grep -vF 'DomainSetMemoryStatsPeriod' ; then
            echo "::error::found a libvirt write call or guest-exec; this project is read-only"
            exit 1
          fi

  publish:
    # Only push images from the real branch and tags, not from pull requests.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

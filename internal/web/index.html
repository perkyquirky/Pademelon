* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-gutter: stable; min-height: 100%; }
body {
  margin: 0;
  padding: 24px;
  background-color: var(--bg);
  background-image: var(--bg-pattern, none);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
h1, h2, h3, .badge, button, select, .status {
  font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Trebuchet MS", system-ui, sans-serif;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.card {
  background: var(--card);
  border: 2px dotted var(--border-dot);
  border-radius: 20px;
  box-shadow: 0 5px 0 var(--shadow);
  padding: 18px 20px;
}
.card-title {
  margin: 0 0 14px;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.01em;
}
.card-title .squig {
  border-bottom: 3px dotted var(--border-dot);
}

.masthead {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.masthead h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 0.02em;
  border-bottom: 4px dotted var(--pd-ear);
}
.tagline { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.masthead-right {
  margin-left: auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}
.status {
  color: var(--muted);
  font-size: 12.5px;
  background: var(--card2);
  border: 2px dotted var(--border-soft);
  border-radius: 999px;
  padding: 4px 12px;
  max-width: 480px;
  word-break: break-word;
}
.status.bad {
  color: var(--bad-tx);
  background: var(--bad-bg);
  border-color: var(--bad-bg);
  font-weight: 700;
}
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ctl {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
button {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
  background: var(--card2);
  border: 2px dotted var(--border-dot);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
}
button:hover { background: var(--accent-soft); }
button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-style: solid;
}
select {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
  background: var(--card2);
  border: 2px dotted var(--border-dot);
  border-radius: 999px;
  padding: 5px 10px;
  cursor: pointer;
}
select:disabled { opacity: 0.55; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#btn-auth.auth-ok {
  border-style: solid;
  color: var(--muted);
  cursor: default;
}
dialog {
  border: 2px dotted var(--border-dot);
  border-radius: 20px;
  background: var(--card);
  color: var(--text);
  box-shadow: 0 5px 0 var(--shadow);
  padding: 18px 20px;
  max-width: 340px;
  width: calc(100vw - 48px);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
dialog .card-title { margin-bottom: 4px; }
.auth-hint { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
#auth-form input {
  width: 100%;
  box-sizing: border-box;
  font: inherit;
  color: var(--text);
  background: var(--card2);
  border: 2px dotted var(--border-dot);
  border-radius: 12px;
  padding: 8px 12px;
}
#auth-form input:focus { border-style: solid; outline: none; }
.auth-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.auth-msg { color: var(--bad-tx); font-size: 12px; font-weight: 700; margin-right: auto; }

.vm-grid {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}
.vm-card {
  background: var(--card2);
  border: 2px dotted var(--border-dot);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 3px 0 var(--shadow);
}
.vm-card header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 2px dotted var(--border-soft);
  padding-bottom: 8px;
  margin-bottom: 10px;
}
.vm-card h3 { margin: 0; font-size: 15px; }
.vm-card.stopped { opacity: 0.6; }
.facts {
  margin: 0;
  display: grid;
  gap: 10px;
}
.facts > div {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 8px;
  align-items: start;
}
.facts dt {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 800;
  padding-top: 2px;
}
.facts dd { margin: 0; min-width: 0; }

.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 800;
  padding: 8px 12px;
  border-bottom: 2px dotted var(--border-dot);
  white-space: nowrap;
}
td {
  padding: 12px;
  border-bottom: 1px dashed var(--border-soft);
  vertical-align: top;
}
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--card2); }
tr.stopped td { opacity: 0.55; }

.name { font-weight: 700; }
.sub { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

.badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 0 2px 0 var(--shadow);
}
.badge.running { background: var(--ok-bg); color: var(--ok-tx); }
.badge.stopped { background: var(--off-bg); color: var(--off-tx); }
.badge.other   { background: var(--warn-bg); color: var(--warn-tx); }
.badge.err     { background: var(--bad-bg); color: var(--bad-tx); }

.meter { min-width: 120px; }
.bar {
  height: 12px;
  background: var(--track);
  border-radius: 999px;
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.12);
  overflow: hidden;
  margin-top: 4px;
}
.bar > span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--fill);
}
.bar > span.warn { background: var(--fill-warn); }
.bar > span.bad  { background: var(--fill-bad); }
.val { font-variant-numeric: tabular-nums; font-size: 12.5px; }

.fs { margin-bottom: 8px; }
.fs:last-child { margin-bottom: 0; }
.dash { color: var(--muted); }

.empty {
  padding: 32px;
  text-align: center;
  color: var(--muted);
}
.empty-pdm { display: block; margin-bottom: 8px; }
.empty-pdm .pdm { animation: bob 3s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@media (prefers-reduced-motion: reduce) {
  .empty-pdm .pdm { animation: none; }
}

.foot {
  text-align: center;
  color: var(--muted);
  font-size: 12.5px;
  padding: 12px 20px;
}
.pdm { image-rendering: pixelated; vertical-align: middle; }
.logo-pdm { flex: none; }
</style>
<script>
(function () {
  "use strict";
  var THEMES = {
    "sweetpea": ["light", "dark"],
    "classic": ["light", "dark"],
    "charm": ["light", "dark"],
    "catppuccin-latte": ["light"],
    "catppuccin-frappe": ["dark"],
    "catppuccin-macchiato": ["dark"],
    "catppuccin-mocha": ["dark"],
    "dracula": ["dark"],
    "noctis": ["light", "dark"]
  };
  var root = document.documentElement;
  var theme = root.getAttribute("data-theme");
  if (!THEMES[theme]) theme = "sweetpea";
  var mode = "auto";
  var media = window.matchMedia("(prefers-color-scheme: dark)");
  try {
    var savedTheme = localStorage.getItem("pademelon.theme");
    if (savedTheme && THEMES[savedTheme]) theme = savedTheme;
    var savedMode = localStorage.getItem("pademelon.mode");
    if (savedMode === "auto" || savedMode === "light" || savedMode === "dark") mode = savedMode;
  } catch (e) {}
  function resolve() {
    var variants = THEMES[theme];
    if (variants.length === 1) return variants[0];
    var wantsDark = mode === "dark" || (mode === "auto" && media.matches);
    return wantsDark ? "dark" : "light";
  }
  function apply() {
    root.setAttribute("data-theme", theme);
    root.setAttribute("data-mode", resolve());
  }
  media.addEventListener("change", function () {
    if (mode === "auto") apply();
  });
  apply();
  window.__pdTheme = {
    themes: THEMES,
    get theme() { return theme; },
    get mode() { return mode; },
    setTheme: function (t) {
      if (!THEMES[t]) return;
      theme = t;
      try { localStorage.setItem("pademelon.theme", t); } catch (e) {}
      apply();
    },
    setMode: function (m) {
      if (m !== "auto" && m !== "light" && m !== "dark") return;
      mode = m;
      try { localStorage.setItem("pademelon.mode", m); } catch (e) {}
      apply();
    }
  };
})();
</script>
</head>
<body>

<div class="wrap">

  <header class="card masthead">
    <span class="logo-pdm" id="logo-pdm" aria-hidden="true"></span>
    <div>
      <h1>pademelon</h1>
      <p class="tagline">a soft little window into your NAS ✿</p>
    </div>
    <div class="masthead-right">
      <span class="status" id="status">loading…</span>
      <div class="controls" role="group" aria-label="View and appearance">
        <button id="btn-table" aria-pressed="false">table view</button>
        <button id="btn-cards" aria-pressed="true">card view</button>
        <label class="ctl">theme
          <select id="theme-select" aria-label="Colour theme">
            <optgroup label="pademelon">
              <option value="sweetpea">sweetpea</option>
              <option value="classic">classic</option>
              <option value="charm">charm</option>
            </optgroup>
            <optgroup label="catppuccin">
              <option value="catppuccin-latte">latte</option>
              <option value="catppuccin-frappe">frappé</option>
              <option value="catppuccin-macchiato">macchiato</option>
              <option value="catppuccin-mocha">mocha</option>
            </optgroup>
            <optgroup label="more">
              <option value="dracula">dracula</option>
              <option value="noctis">noctis</option>
            </optgroup>
          </select>
        </label>
        <label class="ctl">mode
          <select id="mode-select" aria-label="Light or dark mode">
            <option value="auto">auto</option>
            <option value="light">light</option>
            <option value="dark">dark</option>
          </select>
        </label>
        <button id="btn-auth" hidden title="unlock this browser for private routes">🔒 log in</button>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 class="card-title"><span class="squig">vm garden</span> <span aria-hidden="true">🌷</span></h2>
      <div id="table-view" hidden>
        <table>
          <thead>
            <tr>
              <th>VM</th>
              <th>State</th>
              <th>CPU</th>
              <th>Memory</th>
              <th>Addresses</th>
              <th>OS</th>
              <th>Storage</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <ul class="vm-grid" id="grid"></ul>
      <div class="empty" id="empty" hidden>
        <span class="empty-pdm" id="empty-pdm" aria-hidden="true"></span>
        <p>no VMs found… the paddock is empty!</p>
      </div>
    </section>
  </main>

  <footer class="card foot" id="foot"></footer>

</div>

<dialog id="auth-dialog">
  <form id="auth-form" autocomplete="on">
    <h2 class="card-title"><span class="squig">log in</span> <span aria-hidden="true">🔒</span></h2>
    <p class="auth-hint">paste this instance's token (generate one with <code>openssl rand -hex 32</code>)</p>
    <input type="password" id="token" name="token" autocomplete="current-password"
           placeholder="token" required spellcheck="false">
    <div class="auth-row">
      <span class="auth-msg" id="auth-msg" role="alert"></span>
      <button type="button" id="auth-cancel">cancel</button>
      <button type="submit">log in</button>
    </div>
  </form>
</dialog>

<script>
const REFRESH_MS = 1500;

const PDM_MAP = [
  "..oo....oo..",
  ".obeo..oebo.",
  ".obeo..oebo.",
  ".obboooobbo.",
  ".obbbbbbbbo.",
  ".obbbbbbbbo.",
  ".obybbbbybo.",
  ".obbbnnbbbo.",
  ".obllllllbo.",
  ".obbllllbbo.",
  "..obbbbbbo..",
  "...oooooo..."
];
const PDM_PAL = {
  o: "var(--pd-line)",
  b: "var(--pd-body)",
  e: "var(--pd-ear)",
  l: "var(--pd-muz)",
  y: "var(--pd-eye)",
  n: "var(--pd-nose)"
};

function pdmSVG(px) {
  const w = PDM_MAP[0].length;
  const h = PDM_MAP.length;
  let r = "";
  PDM_MAP.forEach((row, y) => {
    [...row].forEach((c, x) => {
      if (PDM_PAL[c]) r += `<rect x="${x}" y="${y}" width="1.03" height="1.03" fill="${PDM_PAL[c]}"/>`;
    });
  });
  return `<svg class="pdm" width="${w * px}" height="${h * px}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" role="img" aria-label="Pademelon mascot">${r}</svg>`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

function fmtBytes(n) {
  if (!n) return "0 B";
  const u = ["B","KiB","MiB","GiB","TiB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n < 10 && i > 0 ? 1 : 0) + " " + u[i];
}

function fmtKiB(kib) { return fmtBytes(kib * 1024); }

function level(pct) { return pct >= 90 ? "bad" : pct >= 75 ? "warn" : ""; }

function meter(pct, label) {
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="meter">
    <div class="val">${esc(label)}</div>
    <div class="bar"><span class="${level(p)}" style="width:${p.toFixed(1)}%"></span></div>
  </div>`;
}

function stateBadge(vm) {
  const cls = vm.running ? "running" : vm.state === "stopped" ? "stopped"
            : vm.state === "crashed" ? "err" : "other";
  return `<span class="badge ${cls}">${esc(vm.state)}</span>`;
}

function agentNote(vm) {
  if (vm.running && vm.agent === "disconnected")
    return `<div class="sub" title="Install the QEMU guest agent in this VM (qemu-guest-agent on Linux, virtio-win guest tools on Windows)">agent not installed</div>`;
  if (vm.running && vm.agent === "error")
    return `<div class="sub" title="${esc(vm.agentError || "")}">agent not answering</div>`;
  if (vm.running && vm.agent === "absent")
    return `<div class="sub">no agent channel</div>`;
  return "";
}

function addresses(vm) {
  const real = (vm.interfaces || []).filter(i => !i.virtual);
  const out = [];
  for (const i of real) {
    for (const ip of (i.ipv4 || [])) out.push(`${ip} <span class="sub">${esc(i.name)}</span>`);
  }
  if (!out.length) return `<span class="dash">—</span>`;
  return `<div class="mono">${out.join("<br>")}</div>`;
}

function storage(vm) {
  const fs = vm.filesystems || [];
  if (!fs.length) return `<span class="dash">—</span>`;
  return fs.map(f => {
    const pct = f.totalBytes ? (f.usedBytes / f.totalBytes * 100) : 0;
    const label = `${esc(f.mountpoint)} · ${fmtBytes(f.usedBytes)} / ${fmtBytes(f.totalBytes)}`;
    return `<div class="fs">${meter(pct, label)}</div>`;
  }).join("");
}

function osHtml(vm) {
  return vm.os
    ? `<div>${esc(vm.os)}</div>` + (vm.kernel ? `<div class="sub mono">${esc(vm.kernel)}</div>` : "")
    : `<span class="dash">—</span>`;
}

function row(vm) {
  const cpu = vm.running
    ? (vm.cpuKnown ? meter(vm.cpuPercent, vm.cpuPercent.toFixed(1) + "%")
                   : `<span class="dash">measuring…</span>`)
    : `<span class="dash">—</span>`;

  const mem = vm.running
    ? (vm.memKnown
        ? meter(vm.memUsedKiB / vm.memTotalKiB * 100,
                `${fmtKiB(vm.memUsedKiB)} / ${fmtKiB(vm.memTotalKiB)}`)
        : `<div class="val sub">${fmtKiB(vm.memTotalKiB)} allocated</div>`)
    : `<div class="val sub">${fmtKiB(vm.memTotalKiB)} allocated</div>`;

  return `<tr class="${vm.running ? "" : "stopped"}">
    <td>
      <div class="name">${esc(vm.hostname || vm.name)}</div>
      <div class="sub">${esc(vm.domain)} · ${vm.vcpus} vCPU</div>
      ${agentNote(vm)}
    </td>
    <td>${stateBadge(vm)}</td>
    <td>${cpu}</td>
    <td>${mem}</td>
    <td>${addresses(vm)}</td>
    <td>${osHtml(vm)}</td>
    <td>${storage(vm)}</td>
  </tr>`;
}

function cardVM(vm) {
  const cpu = vm.running
    ? (vm.cpuKnown ? meter(vm.cpuPercent, vm.cpuPercent.toFixed(1) + "%")
                   : `<span class="dash">measuring…</span>`)
    : `<span class="dash">—</span>`;

  const mem = vm.running && vm.memKnown
    ? meter(vm.memUsedKiB / vm.memTotalKiB * 100,
            `${fmtKiB(vm.memUsedKiB)} / ${fmtKiB(vm.memTotalKiB)}`)
    : `<div class="val sub">${fmtKiB(vm.memTotalKiB)} allocated</div>`;

  return `<li><article class="vm-card ${vm.running ? "" : "stopped"}">
    <header>
      <div>
        <h3 class="name">${esc(vm.hostname || vm.name)}</h3>
        <div class="sub">${esc(vm.domain)} · ${vm.vcpus} vCPU</div>
        ${agentNote(vm)}
      </div>
      ${stateBadge(vm)}
    </header>
    <dl class="facts">
      <div><dt>CPU</dt><dd>${cpu}</dd></div>
      <div><dt>Memory</dt><dd>${mem}</dd></div>
      <div><dt>Addresses</dt><dd>${addresses(vm)}</dd></div>
      <div><dt>OS</dt><dd>${osHtml(vm)}</dd></div>
      <div><dt>Storage</dt><dd>${storage(vm)}</dd></div>
    </dl>
  </article></li>`;
}

const state = { view: "cards" };
const stores = { table: new Map(), cards: new Map() };

function sig(vm) {
  const ips = [];
  for (const i of (vm.interfaces || [])) {
    if (i.virtual) continue;
    for (const ip of (i.ipv4 || [])) ips.push(ip);
  }
  return JSON.stringify([
    vm.hostname || vm.name, vm.domain, vm.vcpus, vm.running,
    vm.agent, vm.agentError || "", vm.cpuKnown, vm.memKnown,
    ips, vm.os || "", vm.kernel || "",
    (vm.filesystems || []).map(f => f.mountpoint)
  ]);
}

function fromHTML(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html.trim();
  return tpl.content.firstElementChild;
}

function setBadge(el, vm) {
  el.className = "badge " + (vm.running ? "running" : vm.state === "stopped" ? "stopped"
    : vm.state === "crashed" ? "err" : "other");
  el.textContent = vm.state;
}

function setMeter(meterEl, pct, label) {
  const p = Math.max(0, Math.min(100, pct));
  meterEl.querySelector(".val").textContent = label;
  const span = meterEl.querySelector(".bar > span");
  span.className = level(p);
  span.style.width = p.toFixed(1) + "%";
}

function updateValues(refs, vm) {
  setBadge(refs.badge, vm);
  if (vm.running && vm.cpuKnown)
    setMeter(refs.cpuMeter, vm.cpuPercent, vm.cpuPercent.toFixed(1) + "%");
  if (vm.running && vm.memKnown)
    setMeter(refs.memMeter, vm.memUsedKiB / vm.memTotalKiB * 100,
      fmtKiB(vm.memUsedKiB) + " / " + fmtKiB(vm.memTotalKiB));
  else
    refs.memVal.textContent = fmtKiB(vm.memTotalKiB) + " allocated";
  (vm.filesystems || []).forEach((f, i) => {
    if (!refs.fsMeters[i]) return;
    setMeter(refs.fsMeters[i],
      f.totalBytes ? f.usedBytes / f.totalBytes * 100 : 0,
      f.mountpoint + " · " + fmtBytes(f.usedBytes) + " / " + fmtBytes(f.totalBytes));
  });
}

function buildCard(vm) {
  const li = fromHTML(cardVM(vm));
  const card = li.firstElementChild;
  const dds = card.querySelectorAll(".facts > div > dd");
  return {
    el: li, sig: sig(vm),
    refs: {
      card: card,
      badge: card.querySelector(".badge"),
      cpuMeter: dds[0].querySelector(".meter"),
      memMeter: dds[1].querySelector(".meter"),
      memVal: dds[1].querySelector(".val.sub"),
      fsMeters: [...card.querySelectorAll(".facts .fs .meter")]
    }
  };
}

function buildRow(vm) {
  const tr = fromHTML(row(vm));
  return {
    el: tr, sig: sig(vm),
    refs: {
      badge: tr.children[1].firstElementChild,
      cpuMeter: tr.children[2].querySelector(".meter"),
      memMeter: tr.children[3].querySelector(".meter"),
      memVal: tr.children[3].querySelector(".val.sub"),
      fsMeters: [...tr.children[6].querySelectorAll(".fs .meter")]
    }
  };
}

function frozenSet(store) {
  const sel = document.getSelection();
  const out = new Set();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return out;
  const range = sel.getRangeAt(0);
  for (const [, entry] of store) {
    if (range.intersectsNode(entry.el)) out.add(entry.el);
  }
  return out;
}

function selectionTouches(el) {
  const sel = document.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return false;
  return sel.getRangeAt(0).intersectsNode(el);
}

function renderVMs(vms) {
  const isTable = state.view === "table";
  const host = document.getElementById(isTable ? "rows" : "grid");
  const store = stores[state.view];
  const frozen = frozenSet(store);
  const build = isTable ? buildRow : buildCard;

  const seen = new Set();
  const ordered = [];
  for (const vm of vms) {
    seen.add(vm.domain);
    let entry = store.get(vm.domain);
    if (!entry) {
      entry = build(vm);
      store.set(vm.domain, entry);
      host.appendChild(entry.el);
    }
    if (frozen.has(entry.el)) {
      ordered.push(entry.el);
      continue;
    }
    const next = sig(vm);
    if (entry.sig !== next) {
      const fresh = build(vm);
      entry.el.replaceWith(fresh.el);
      store.set(vm.domain, fresh);
      entry = fresh;
    } else {
      updateValues(entry.refs, vm);
      if (isTable) entry.el.classList.toggle("stopped", !vm.running);
      else entry.refs.card.classList.toggle("stopped", !vm.running);
    }
    ordered.push(entry.el);
  }
  for (const [key, entry] of [...store]) {
    if (!seen.has(key) && !frozen.has(entry.el)) {
      entry.el.remove();
      store.delete(key);
    }
  }
  let prev = null;
  for (const el of ordered) {
    if (frozen.has(el)) {
      prev = el;
      continue;
    }
    if (el.previousElementSibling !== prev)
      host.insertBefore(el, prev ? prev.nextSibling : host.firstChild);
    prev = el;
  }
  document.getElementById("empty").hidden = store.size > 0;
}

async function tick() {
  const statusEl = document.getElementById("status");
  const footEl = document.getElementById("foot");
  try {
    const res = await fetch("/api/vms", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const snap = await res.json();

    const vms = (snap.vms || []).slice().sort((a, b) => {
      if (a.running !== b.running) return a.running ? -1 : 1;
      return (a.name || "").localeCompare(b.name || "");
    });

    document.getElementById("table-view").hidden = state.view !== "table";
    document.getElementById("grid").hidden = state.view !== "cards";
    renderVMs(vms);

    if (!selectionTouches(statusEl)) {
      if (snap.connected) {
        statusEl.className = "status";
        statusEl.textContent = `${vms.length} VMs · polled ${new Date(snap.polled).toLocaleTimeString()} · ${snap.pollMs} ms`;
      } else {
        statusEl.className = "status bad";
        statusEl.textContent = `libvirt disconnected — showing last known data. ${snap.error || ""}`;
      }
    }
    if (!selectionTouches(footEl)) {
      footEl.textContent =
        "refreshes every " + (REFRESH_MS / 1000) + "s · read-only · made with ♥ (˶ˆᗜˆ˵)";
    }
  } catch (e) {
    statusEl.className = "status bad";
    statusEl.textContent = "can't reach Pademelon: " + e.message;
  }
}

document.getElementById("logo-pdm").innerHTML = pdmSVG(4);
document.getElementById("empty-pdm").innerHTML = pdmSVG(9);

document.getElementById("btn-table").addEventListener("click", () => {
  state.view = "table";
  paintViewButtons();
  tick();
});
document.getElementById("btn-cards").addEventListener("click", () => {
  state.view = "cards";
  paintViewButtons();
  tick();
});

function paintViewButtons() {
  document.getElementById("btn-table").setAttribute("aria-pressed", String(state.view === "table"));
  document.getElementById("btn-cards").setAttribute("aria-pressed", String(state.view === "cards"));
}

function paintAppearance() {
  if (!window.__pdTheme) return;
  const themeSelect = document.getElementById("theme-select");
  const modeSelect = document.getElementById("mode-select");
  themeSelect.value = window.__pdTheme.theme;
  modeSelect.value = window.__pdTheme.mode;
  const singleVariant = window.__pdTheme.themes[window.__pdTheme.theme].length < 2;
  modeSelect.disabled = singleVariant;
  modeSelect.title = singleVariant ? "this theme has one fixed variant" : "";
}

const themeSelect = document.getElementById("theme-select");
const modeSelect = document.getElementById("mode-select");
themeSelect.addEventListener("change", () => {
  if (window.__pdTheme) window.__pdTheme.setTheme(themeSelect.value);
  paintAppearance();
});
modeSelect.addEventListener("change", () => {
  if (window.__pdTheme) window.__pdTheme.setMode(modeSelect.value);
  paintAppearance();
});
paintAppearance();

// --- auth ---------------------------------------------------------------
// The server tells us (once, publicly) whether auth is on; the login form
// sends the token once as a Bearer header and the server replies with a
// session cookie that rides along on every later fetch automatically.
const btnAuth = document.getElementById("btn-auth");
const authDialog = document.getElementById("auth-dialog");
const authForm = document.getElementById("auth-form");
const authMsg = document.getElementById("auth-msg");
let authOK = false;

function paintAuth() {
  btnAuth.textContent = authOK ? "🔒 auth ok" : "🔒 log in";
  btnAuth.classList.toggle("auth-ok", authOK);
}

async function checkCapabilities() {
  try {
    const res = await fetch("/api/capabilities", { cache: "no-store" });
    if (!res.ok) return;
    const caps = await res.json();
    if (!caps.authRequired) return;
    // A previous login may still be valid via the session cookie.
    const chk = await fetch("/api/auth/check", { cache: "no-store" });
    authOK = chk.ok;
    btnAuth.hidden = false;
    paintAuth();
  } catch (e) {
    // capabilities failing should never break the dashboard itself
  }
}

btnAuth.addEventListener("click", () => {
  authMsg.textContent = "";
  authDialog.showModal();
});
document.getElementById("auth-cancel").addEventListener("click", () => authDialog.close());

authForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  authMsg.textContent = "";
  const token = document.getElementById("token").value;
  try {
    const res = await fetch("/api/auth/check", {
      cache: "no-store",
      headers: { Authorization: "Bearer " + token },
    });
    if (res.ok) {
      authOK = true;
      paintAuth();
      authDialog.close();
    } else {
      authMsg.textContent = "wrong token — try again";
    }
  } catch (err) {
    authMsg.textContent = "can't reach Pademelon: " + err.message;
  }
});

checkCapabilities();

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>

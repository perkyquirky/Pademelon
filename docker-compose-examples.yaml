# The following is for explaining the compose options:
# Illustrative example only! — copy docker-compose.yaml from the repo as your starting point.

services:
  pademelon:
    image: ghcr.io/perkyquirky/pademelon:latest
    container_name: pademelon
    restart: unless-stopped

    ports:
      - "8088:8088"

    volumes:
      - /run/truenas_libvirt:/run/truenas_libvirt
    user: "0:0"

    command:
    # Select default theme
    # Valid options: sweetpea, classic, charm, catppuccin-latte, catppuccin-frappe, catppuccin-macchiato, catppuccin-mocha, dracula, noctis
      - "-theme=dracula"

    # -listen changes the internal listen port. Do not change it unless
    # you know why you would.
      - "-listen=:8088"

    # Caps how many VMs are polled at once. 0 (the default) uses one
    # worker per VM — all guests in a single wave — so most setups need
    # nothing here. Set a number only to cap a very large fleet or slow
    # storage.
    # - "-concurrency=0"

    # This sets the polling rate for all stats. The data must be read
    # from the libvirt socket for fresh values, so set this timer.
    # CPU usage, memory usage, network info, drive data, agent status,
    # and more all follow this timer.
      - "-interval=30s"

    # Caps each guest agent command at 5 seconds, so if one command hangs
    # the poll moves on instead of stalling on that VM.
      - "-agent-timeout=5s"

    # This is required for fresh memory statistics; without it, the data
    # is stale. Do not adjust unless necessary.
      - "-stats-period=10s"

    # Sets the level of logging: `debug`, `info`, `warn`, `error`
      - "-log-level=info"

    # Sets the logging output format: `text` or `json`
      - "-log-format=text"

    # Sets the path for the libvirt socket. This will not need changing
    # unless TrueNAS changes the location of the socket. If the socket
    # ever moves, change the host
    # side (left) of the mount to the new directory — the container side can stay
    # /run/truenas_libvirt:
    #   volumes:
    #     - /new/host/dir:/run/truenas_libvirt
    # Only if the socket file name changes too do you need to point -socket at the
    # new file. Always mount the directory, not the socket file: libvirtd deletes
    # and recreates the socket when it restarts, and a mounted file goes dead.
      - "-socket=/run/truenas_libvirt/libvirt-sock"

# ---------------------------------------------------------------
# Token auth — required for the VM power actions, optional otherwise.
# This stops anyone on the local network from making changes to VMs
# without authentication. This is NOT a valid security measure for
# internet-facing traffic.
#
# Generate a token with:  openssl rand -hex 32
# or use a password of your choosing.
#
# Two ways to hand it to the container:
#
# 1) Environment variable (simple, but visible in `docker inspect`):
#    environment:
#      - PADAMELON_TOKEN=<your generated token>
#
# 2) Docker secrets file (keeps the value out of compose and inspect):
#    environment:
#      - PADAMELON_TOKEN_FILE=/run/secrets/pademelon_token
#    secrets:
#      - pademelon_token
#
# With a token set, a "log in" button appears on the page. Enter it once
# per browser (password managers can save it); you stay logged in for 30
# days via a HttpOnly, SameSite=Lax cookie. "log out" clears it. Rotating
# the token logs every browser out at once.
# ---------------------------------------------------------------
#
# ---------------------------------------------------------------
# VM power actions — start, shutdown, reboot, force off, pause,
# resume, and a bulk "shut down all". These need BOTH the token
# above AND the switch below:
#
#    - PADAMELON_ALLOW_ACTIONS=true
#
# The container refuses to start with actions enabled and no token —
# buttons that stop VMs never exist unauthenticated. Without the switch,
# the dashboard is fully read-only (no action routes exist at all).
# Actions are queued as jobs and run in the background; the dashboard
# says "requested", and the poller confirms the result.
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# TrueNAS middleware — OPTIONAL. The dashboard works fully without it;
# this only powers the snapshot features (list, snapshot now, restore,
# delete). You need:
#
#   1. A dedicated TrueNAS service account with an API key —
#      setup recipe: documentation/truenas-service-account.md
#      (three roles: SNAPSHOT_READ, SNAPSHOT_WRITE, SNAPSHOT_DELETE)
#   2. The NAS address below.
#
# With a host set but no key, the container REFUSES to start — a
# half-configured integration is a config error, not a degraded mode.
# The service account needs snapshot privileges only. Snapshots that
# Pademelon makes are ordinary ZFS snapshots, and they appear in the
# TrueNAS UI too.
#
#    environment:
#      - TRUENAS_HOST=192.168.1.100
#      # Visible in `docker inspect` — the file form keeps it out:
#      - TRUENAS_API_KEY_FILE=/run/secrets/truenas_api_key
#    secrets:
#      - truenas_api_key
#
# (secrets block at file level:)
# secrets:
#   truenas_api_key:
#     file: ./truenas-api-key.txt
# ---------------------------------------------------------------

# Full example with actions enabled — copy these lines into your
# service block if you want the power buttons:

# services:
#   pademelon:
#     image: ghcr.io/perkyquirky/pademelon:latest
#     container_name: pademelon
#     restart: unless-stopped
#
#     ports:
#       - "8088:8088"
#
#     volumes:
#       - /run/truenas_libvirt:/run/truenas_libvirt
#     user: "0:0"
#
#     environment:
#       # Required for actions. Generate with: openssl rand -hex 32
#       - PADAMELON_TOKEN=change-me-to-your-generated-token
#       # Unlocks the power actions. Needs the token above.
#       - PADAMELON_ALLOW_ACTIONS=true
#       # Optional: the TrueNAS middleware integration for snapshots.
#       # See the block above and documentation/truenas-service-account.md
#       - TRUENAS_HOST=192.168.1.100
#       - TRUENAS_API_KEY=the-service-account-api-key

secrets:
  pademelon_token:
    file: ./pademelon_token.txt